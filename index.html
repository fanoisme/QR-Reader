<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMVCo QR Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; color: #333; max-width: 950px; margin: 0 auto; padding: 20px; position: relative;}
    #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
    .auth-box { background: #34495e; padding: 40px; border-radius: 10px; max-width: 400px; width: 90%; }
    .auth-box h2 { margin-top: 0; color: #ecf0f1; border-bottom: 2px solid #7f8c8d; padding-bottom: 10px;}
    .auth-input { width: 100%; padding: 12px; margin-top: 20px; font-size: 18px; text-align: center; border-radius: 5px; border: none; letter-spacing: 5px; outline: none;}
    .auth-btn { width: 100%; padding: 12px; margin-top: 15px; background: #27ae60; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    .auth-error { color: #e74c3c; margin-top: 10px; font-weight: bold; font-size: 14px; min-height: 20px;}
    .loader { border: 4px solid #7f8c8d; border-top: 4px solid #ecf0f1; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .app-wrapper { display: none; } 
    .container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative; }
    .expiry-badge { position: absolute; top: 20px; right: 20px; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
    .expiry-badge span { display: inline-block; width: 8px; height: 8px; background: #28a745; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0,0,0,0); } }
    h2.main-title { text-align: center; color: #0056b3; margin-top: 0; } 
    .tabs { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 25px; margin-top: 20px;}
    .tab-btn { flex: 1; padding: 12px; background: #eee; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #555; }
    .tab-btn.active { background: #0056b3; color: white; border-radius: 8px 8px 0 0; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], input[type="number"], select, input[type="file"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .btn-main { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .result-section { margin-top: 30px; display: none; border: 2px solid #28a745; padding: 20px; border-radius: 10px; background-color: #f0fdf4; }
    .output-box { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch;}
    .qr-box { text-align: center; background: #fff; padding: 15px; border-radius: 10px; border: 1px dashed #ccc; width: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center;}
    #qrCodeContainer { margin-bottom: 15px; }
    .log-data { flex: 1; font-family: monospace; font-size: 14px; background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 5px; overflow-x: auto;}
    .btn-copy { background-color: #6c757d; color: white; border: none; border-radius: 3px; padding: 3px 8px; font-size: 11px; cursor: pointer; margin-left: 10px;}
    .btn-copy.copied { background-color: #28a745; }
    .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 5px; }
    .btn-action { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; margin-top: 5px; background: #28a745; color: white;}
    .drag-area { border: 2px dashed #0056b3; border-radius: 10px; padding: 30px; text-align: center; background: #f8f9fa; cursor: pointer; }
    
    .history-section { margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .history-grid { display: grid; grid-template-columns: 1fr; gap: 15px; max-height: 600px; overflow-y: auto; padding-right: 5px;}
    .history-card { display: flex; background: #fdfdfd; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; gap: 15px; align-items: flex-start; transition: box-shadow 0.2s;}
    .history-card:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .history-qr { width: 140px; text-align: center; flex-shrink: 0;}
    .history-qr img { width: 100%; height: auto; border: 1px solid #ddd; border-radius: 5px; background: #fff; margin-bottom: 5px; padding: 5px;}
    .history-details { flex: 1; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #333; word-break: break-all;}
    .history-details strong { font-family: 'Segoe UI', sans-serif; font-size: 16px; color: #0056b3;}
    .notes-box { background: #fff3cd; color: #856404; padding: 8px; border-radius: 4px; border: 1px solid #ffeeba; font-family: 'Segoe UI', sans-serif; font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
    .empty-state { text-align: center; color: #777; font-style: italic; padding: 20px; }

    .history-actions { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .btn-csv { background-color: #17a2b8; }
    .btn-csv:hover { background-color: #138496; }
    .btn-clear { background-color: #dc3545; }
    .btn-clear:hover { background-color: #c82333; }
    
    #btnTabGen, #tab-generate { display: none !important; }
    
</style>
</head>
<body>
    
<div id="authOverlay">
    <div class="auth-box">
        <h2>System Security</h2>
        <div id="authLoader" class="loader"></div>
        <p id="authMessage">Verifying license via secure server...</p>
        <div id="pinSection" style="display: none;">
            <input type="password" id="pinInput" class="auth-input" placeholder="Enter PIN" onkeypress="if(event.key === 'Enter') window.unlockApp()">
            <div id="authError" class="auth-error"></div>
            <button class="auth-btn" onclick="window.unlockApp()">Unlock Access</button>
        </div>
    </div>
</div>

<div class="app-wrapper" id="mainApplication">
    <div class="container">
        <div class="expiry-badge" id="expiryBadgeUI"><span></span> Checking License...</div>
        <h2 class="main-title">EMVCo QR Tool</h2>
        <div class="tabs">
            <button class="tab-btn" id="btnTabGen" onclick="window.switchTab('generate')">🔨 Generate QR</button>
            <button class="tab-btn" id="btnTabRead" onclick="window.switchTab('read')">🔍 Read QR</button>
        </div>

        <div id="tab-generate" class="tab-content">
            <div class="form-group"><label>QR Type:</label><select id="qrType" onchange="window.toggleNominal()"><option value="1">Open Amount</option><option value="2">Open Amount + Tips</option><option value="3">Fix Rate</option></select></div>
            <div class="form-group"><label>Merchant Name:</label><input type="text" id="merchantName" placeholder="Ex: BAKSO ABANG CHA"></div>
            <div class="form-group"><label>Merchant City:</label><input type="text" id="merchantCity" placeholder="Ex: JAKARTA"></div>
            <div class="form-group" id="nominalGroup" style="display: none;"><label>Nominal Amount:</label><input type="number" id="nominal" placeholder="Ex: 50000"></div>
            <div class="form-group"><label>Notes (Optional):</label><textarea id="notesGen" rows="2"></textarea></div>
            <button class="btn-main" onclick="window.generateQR()">Generate QR Code</button>
            
            <div class="result-section" id="resultSectionGen">
                <h3>✅ Generated!</h3>
                <div class="output-box">
                    <div class="qr-box"><div id="qrCodeContainer"></div><button class="btn-action" onclick="window.downloadImage('merchantName')" style="width:100%">⬇ Download Image</button></div>
                    <div class="log-data" id="logTextGen"></div>
                </div>
            </div>
            <div class="history-section">
                <div class="history-header">
                    <h3 style="margin: 0;">Generated History</h3>
                    <div class="history-actions">
                        <button class="btn-action" onclick="window.downloadHistoryAsHTML('gen')">⬇ .html</button>
                        <button class="btn-action btn-csv" onclick="window.downloadHistoryAsCSV('gen')">⬇ .csv</button>
                        <button class="btn-action btn-clear" onclick="window.clearHistory('gen')">🗑 Clear</button>
                    </div>
                </div>
                <div class="history-grid" id="historyContainerGen"></div>
            </div>
        </div>

        <div id="tab-read" class="tab-content">
            <div class="form-group"><label>Notes (Optional):</label><textarea id="notesRead" rows="2"></textarea></div>
            <div class="form-group"><label>Upload QR Code Image:</label><div class="drag-area" id="dragArea" onclick="document.getElementById('qrUpload').click()"><p>Click or Paste (Ctrl+V) Image Here</p><input type="file" id="qrUpload" accept="image/*" style="display: none;" onchange="window.handleQRUpload(event)"></div></div>
            
            <div class="result-section" id="resultSectionRead">
                <h3>✅ Decoded!</h3>
                <div class="output-box">
                    <div class="qr-box"><img id="scannedQrImg" src="" style="max-width:100%;"><button class="btn-action" onclick="window.downloadImageRead()" style="width:100%">⬇ Download Image</button></div>
                    <div class="log-data" id="logTextRead"></div>
                </div>
            </div>
            <div class="history-section">
                <div class="history-header">
                    <h3 style="margin: 0;">Scanned QR History</h3>
                    <div class="history-actions">
                        <button class="btn-action" onclick="window.downloadHistoryAsHTML('read')">⬇ .html</button>
                        <button class="btn-action btn-csv" onclick="window.downloadHistoryAsCSV('read')">⬇ .csv</button>
                        <button class="btn-action btn-clear" onclick="window.clearHistory('read')">🗑 Clear</button>
                    </div>
                </div>
                <div class="history-grid" id="historyContainerRead"></div>
            </div>
        </div>
    </div>
</div>
